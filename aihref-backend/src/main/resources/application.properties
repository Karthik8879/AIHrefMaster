# Application Configuration
spring.application.name=aihref-backend

# MongoDB Configuration (local for development, Atlas for production)
spring.data.mongodb.uri=mongodb+srv://karthiksridhar8879_db_user:8HbGfbTlvJJJiiJZ@cluster0.rrpwth5.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.database=aihref

# Redis Configuration (only for production)
# Set REDIS_URL environment variable to enable Redis
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# WebFlux Configuration
# spring.webflux.base-path=/api/v1

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging Configuration
logging.level.com.aihref=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# External API Configuration
external.apis.similarweb.base-url=https://api.similarweb.com/v4
external.apis.similarweb.timeout=10000
external.apis.pagespeed.base-url=https://www.googleapis.com/pagespeedonline/v5
external.apis.pagespeed.api-key=${LIGHTHOUSE_API_KEY:}
external.apis.pagespeed.timeout=10000
external.apis.rdap.base-url=https://rdap.org
external.apis.rdap.timeout=5000
external.apis.cloudflare.base-url=https://api.cloudflare.com/client/v4/radar
external.apis.cloudflare.timeout=5000
external.apis.safe-browsing.base-url=https://safebrowsing.googleapis.com/v4
external.apis.safe-browsing.api-key=${SAFE_BROWSING_API_KEY:}
external.apis.safe-browsing.timeout=5000

# Rate Limiting Configuration
rate-limit.requests-per-minute=120
rate-limit.window-size-minutes=1

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha