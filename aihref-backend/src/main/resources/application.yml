spring:
  application:
    name: aihref-backend
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aihref}
    
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h

  webflux:
    base-path: /api/v1

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.aihref: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.data.mongodb: DEBUG

# External API Configuration
external:
  apis:
    similarweb:
      base-url: https://api.similarweb.com/v4
      timeout: 10000
    pagespeed:
      base-url: https://www.googleapis.com/pagespeedonline/v5
      api-key: ${LIGHTHOUSE_API_KEY:}
      timeout: 10000
    rdap:
      base-url: https://rdap.org
      timeout: 5000
    cloudflare:
      base-url: https://api.cloudflare.com/client/v4/radar
      timeout: 5000
    safe-browsing:
      base-url: https://safebrowsing.googleapis.com/v4
      api-key: ${SAFE_BROWSING_API_KEY:}
      timeout: 5000

# Rate Limiting
rate-limit:
  requests-per-minute: 120
  window-size-minutes: 1

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
