version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: aihref-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aihref
    volumes:
      - mongodb_data:/data/db
    networks:
      - aihref-network

  redis:
    image: redis:7.2-alpine
    container_name: aihref-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aihref-network

  backend:
    build:
      context: ./aihref-backend
      dockerfile: Dockerfile
    container_name: aihref-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/aihref
      REDIS_URL: redis://redis:6379
      LIGHTHOUSE_API_KEY: ${LIGHTHOUSE_API_KEY:-}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
    depends_on:
      - mongodb
      - redis
    networks:
      - aihref-network

  frontend:
    build:
      context: ./aihref-frontend
      dockerfile: Dockerfile
    container_name: aihref-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    networks:
      - aihref-network

volumes:
  mongodb_data:
  redis_data:

networks:
  aihref-network:
    driver: bridge
